  <text x="90" y="420" font-family="Arial, sans-serif" font-weight="700" font-size="24" fill="#f2ece5">Maple Leaf Community Council</text>
  <text x="90" y="452" font-family="Arial, sans-serif" font-weight="400" font-size="22" fill="#f2ece5" opacity="0.8">Costumes, candy, and neighbors — all ages welcome</text>
