<svg width="1200" height="675" viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#f2ece5"/>

  <!-- twilight sky band -->
  <rect x="0" y="0" width="1200" height="380" fill="#34422e" opacity="0.08"/>

  <!-- houses silhouette row -->
  <g fill="#34422e" opacity="0.9">
    <rect x="60" y="470" width="150" height="120" />
    <polygon points="45,470 135,400 225,470"/>
    <rect x="260" y="430" width="180" height="160"/>
    <polygon points="240,430 350,350 460,430"/>
    <rect x="480" y="500" width="120" height="90"/>
    <polygon points="465,500 540,450 615,500"/>
    <rect x="640" y="440" width="160" height="150"/>
    <polygon points="622,440 720,365 818,440"/>
    <rect x="840" y="480" width="140" height="110"/>
    <polygon points="822,480 910,415 998,480"/>
    <rect x="1020" y="450" width="130" height="140"/>
    <polygon points="1003,450 1085,385 1167,450"/>
  </g>

  <!-- porch lights -->
  <g fill="#e2924f">
    <circle cx="135" cy="440" r="10"/>
    <circle cx="350" cy="375" r="10"/>
    <circle cx="540" cy="475" r="9"/>
    <circle cx="720" cy="405" r="10"/>
    <circle cx="910" cy="450" r="9"/>
    <circle cx="1085" cy="415" r="10"/>
  </g>
  <g fill="#e2924f" opacity="0.25">
    <circle cx="135" cy="440" r="26"/>
    <circle cx="350" cy="375" r="28"/>
    <circle cx="720" cy="405" r="26"/>
    <circle cx="1085" cy="415" r="26"/>
  </g>

  <!-- ground -->
  <rect x="0" y="590" width="1200" height="6" fill="#34422e" opacity="0.4"/>

  <!-- title -->
  <text x="600" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="24" fill="#34422e" letter-spacing="5" opacity="0.85">NATIONAL NIGHT OUT · MAPLE LEAF</text>
  <text x="600" y="300" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="100" fill="#34422e" letter-spacing="-1">NIGHT OUT</text>

  <text x="600" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-weight="400" font-size="24" fill="#34422e" opacity="0.8">Meet your block. Celebrate neighborhood safety together.</text>
</svg>
